name: LegalMind Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Check Expo project
        run: npx expo config --type public

      - name: Create project archive
        run: |
          mkdir -p legalmind-test
          cp package.json legalmind-test/
          cp app.json legalmind-test/
          cp index.js legalmind-test/
          zip -r legalmind-test.zip legalmind-test

      - name: Upload Test Build
        uses: actions/upload-artifact@v4
        with:
          name: LegalMind-Test
          path: legalmind-test.zip